name: release

# Single workflow that handles both halves of the release lifecycle:
#
#  1. `release-please` job — watches `main` for conventional commits and
#     maintains an open "chore: release X.Y.Z" PR. Merging that PR runs
#     this workflow again: release-please now sees the bumped manifest,
#     pushes the git tag, and creates the GitHub Release.
#
#  2. `publish` job — gated on `needs.release-please.outputs.release_created`.
#     Only fires when step 1 actually cut a release this run. Runs the
#     full test gate and publishes to npm with provenance via Trusted
#     Publishing (OIDC).
#
# Why both live in one workflow: events emitted by `GITHUB_TOKEN`
# (including release-please's "release published" event) do NOT trigger
# other workflows in this repo — it's GitHub's loop-prevention rule. A
# separate `release: published` workflow never fires. Colocating the
# publish step sidesteps the limitation without needing a PAT.

on:
  push:
    branches: [main]
  # Safety valve for hotfixes or retries: publish an already-tagged
  # version without going through release-please.
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or SHA) to publish — skips release-please job"
        required: true
        type: string

# `release-please` needs contents:write and pull-requests:write to open
# its PR and create the GitHub Release. `publish` narrows to its own
# minimum (id-token for OIDC, contents:read to check out).
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.95"
  # Node 24 ships npm 11.x — required for the Trusted Publishing OIDC
  # handshake. On npm 10.x (Node 22 default) the provenance attestation
  # gets signed but the tarball PUT goes anonymous and 404s.
  NODE_VERSION: "24"

jobs:
  release-please:
    name: release-please (version PR + GitHub Release)
    runs-on: ubuntu-latest
    # Skip entirely on manual dispatch — user wants to publish a
    # specific ref, not re-run release-please.
    if: ${{ github.event_name != 'workflow_dispatch' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  publish:
    name: npm publish (provenance via OIDC)
    runs-on: ubuntu-latest
    # Gate: only publish if release-please just cut a release OR if a
    # human explicitly dispatched. `always()` lets the job run even
    # when release-please was skipped (workflow_dispatch path).
    needs: release-please
    if: >-
      ${{
        always() &&
        (
          needs.release-please.result == 'success' &&
          needs.release-please.outputs.release_created == 'true'
        ) ||
        github.event_name == 'workflow_dispatch'
      }}
    environment: npm-publish
    permissions:
      # id-token: write is what turns OIDC on — required for both
      # npm Trusted Publishing and npm provenance attestations.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Prefer the manual ref; otherwise the tag release-please just
          # created; otherwise the event's own ref (safety fallback).
          ref: ${{ inputs.ref || needs.release-please.outputs.tag_name || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Report npm + node versions
        run: node --version && npm --version

      - run: npm ci

      # Standard gate: lint + typecheck, then Rust + TS tests.
      - run: npm run check
      - run: npm run test

      # Produce the publish artefact from a clean build.
      - run: npm run build

      - name: npm pack --dry-run (final sanity log)
        run: npm pack --dry-run

      - name: npm publish with provenance
        # Trusted Publishing is configured on npmjs.com for this
        # package + workflow + environment, so npm exchanges the OIDC
        # token (`id-token: write` above) for a short-lived publish
        # credential. No NODE_AUTH_TOKEN needed.
        run: npm publish --provenance --access public
